name: HapticCodeReview
options:
  bundleIdPrefix: ca.anchit
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGNING_ALLOWED: NO
targets:
  HapticCodeReview:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anchit.HapticCodeReview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Haptic Code Review
  HapticCodeReviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: HapticCodeReview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
