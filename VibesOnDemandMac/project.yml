name: VibesOnDemandMac
options:
  bundleIdPrefix: ca.anchit
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGNING_ALLOWED: NO
targets:
  VibesOnDemandMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anchit.VibesOnDemandMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vibes on Demand
  VibesOnDemandMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VibesOnDemandMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
